name: Build, test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: 2
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-inference.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qtbase5-dev libopencv-dev
          python -m pip install -r requirements-inference.txt
          dpkg-query -W > dependencies-linux.txt
          python -m pip freeze >> dependencies-linux.txt
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Test native pipeline and real ONNX helper
        env:
          UDP_VISION_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          ctest --test-dir build --output-on-failure --output-junit test-results.xml
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m pip check
      - name: Package Linux application (system Qt/OpenCV required)
        run: cd build && cpack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-build-and-test
          path: |
            build/*.zip
            build/*.png
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            dependencies-linux.txt

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-inference.txt
      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-opencv
      - name: Configure, build and test native pipeline
        shell: msys2 {0}
        run: |
          pacman -Q > dependencies-windows.txt
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --output-junit test-results.xml
      - name: Test Python inference and create portable distribution
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin;$env:PATH"
          $python = "${{ env.pythonLocation }}\python.exe"
          & $python -m pip install -r requirements-inference.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python scripts/package_windows.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-portable-and-test
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.sha256
            build/*.png
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            dependencies-windows.txt
